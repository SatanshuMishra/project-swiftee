name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/capabilities/**'
      - '.claude/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      REVIEW_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip until the review is configured
        if: env.REVIEW_CONFIGURED != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so the Claude review was skipped. Install the Claude GitHub App and add the secret to enable it."

      - name: Checkout
        if: env.REVIEW_CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude reviewers
        if: env.REVIEW_CONFIGURED == 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: ".claude/settings.json"
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Skill,Agent,Bash(git diff:*),Bash(gh pr diff:*),Bash(git log:*),Bash(gh pr comment:*)"
            --disallowed-tools "Write,Edit,NotebookEdit,Bash(npm:*),Bash(npx:*),Bash(cargo:*),Bash(cd src-tauri && cargo:*),Bash(git push:*),Bash(git diff --no-index:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr close:*),Bash(gh pr edit:*)"
          prompt: |
            Run the /review-pr slash command for PR #${{ github.event.pull_request.number }}.

            Use the dispatch pattern documented in .claude/commands/review-pr.md:
            three reviewers in parallel (rust-tauri-reviewer, react-tauri-reviewer,
            tauri-security-reviewer), then santa-method convergence.

            Post the result with
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file -`
            and a quoted heredoc on standard input, so each push updates one comment,
            in this format:

              # Claude Review

              **Verdict:** APPROVED | CHANGES REQUESTED | COMMENT

              ## Findings
              <numbered list>

              ## Files reviewed
              <list>
