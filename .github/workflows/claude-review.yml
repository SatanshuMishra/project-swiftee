name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/capabilities/**'
      - '.claude/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude reviewers
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: ".claude/settings.json"
          use_sticky_comment: "true"
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Skill,Agent,Bash(git diff:*),Bash(gh pr diff:*),Bash(git log:*)"
          prompt: |
            Run the /review-pr slash command for PR #${{ github.event.pull_request.number }}.

            Use the dispatch pattern documented in .claude/commands/review-pr.md:
            three reviewers in parallel (rust-tauri-reviewer, react-tauri-reviewer,
            tauri-security-reviewer), then santa-method convergence.

            Post a single consolidated review comment to this PR in this format:

              # Claude Review

              **Verdict:** APPROVED | CHANGES REQUESTED | COMMENT

              ## Findings
              <numbered list>

              ## Files reviewed
              <list>
