name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-versions:
    name: Validate version coherence + extract release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_notes: ${{ steps.extract-notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert versions match across package.json, Cargo.toml, tauri.conf.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk -F'"' '/^version/{print $2; exit}' src-tauri/Cargo.toml)
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Versions: tag=$TAG package=$PKG cargo=$CARGO conf=$CONF"
          if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$CARGO" ] || [ "$CARGO" != "$CONF" ]; then
            echo "::error::Version drift detected — tag, package.json, Cargo.toml, and tauri.conf.json must all match"
            exit 1
          fi
      - name: Assert CHANGELOG entry exists for this tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing"
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for ## [$TAG]"
            exit 1
          fi
      - name: Refuse to release with the development minisign pubkey
        run: |
          set -euo pipefail
          # Three independent failure modes are distinguished:
          #   1. Empty/missing/too-short pubkey → operator forgot to embed.
          #   2. Non-base64 pubkey → typo or copy-paste corruption.
          #   3. Dev pubkey (key ID 2A43CC33F3FB57BB) still embedded → must
          #      rotate to production keypair (plan Task 10) before tagging.
          node -e '
            const conf = require("./src-tauri/tauri.conf.json");
            const pk = conf?.plugins?.updater?.pubkey ?? "";
            if (!pk || pk.length < 64) {
              console.error("::error::tauri.conf.json plugins.updater.pubkey is empty or implausibly short. Embed a production minisign pubkey before releasing.");
              process.exit(1);
            }
            let decoded;
            try {
              decoded = Buffer.from(pk, "base64").toString("utf8");
            } catch {
              console.error("::error::tauri.conf.json plugins.updater.pubkey is not valid base64.");
              process.exit(1);
            }
            if (decoded.includes("2A43CC33F3FB57BB")) {
              console.error("::error::Development minisign pubkey (key ID 2A43CC33F3FB57BB) is still embedded in tauri.conf.json. Rotate to a production keypair before releasing — see plan Task 10.");
              process.exit(1);
            }
          '
      - name: Extract release notes from CHANGELOG section for this tag
        id: extract-notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          # Capture lines under "## [$TAG]" until the next "## [" heading.
          # Strips trailing blank lines so the body lands cleanly in the
          # release page and in tauri-action's emitted latest.json.
          NOTES=$(awk -v ver="## [$TAG]" '
            index($0, ver) == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')
          {
            echo "notes<<NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"


  ci:
    name: CI
    needs: validate-versions
    uses: ./.github/workflows/ci.yml
    with:
      skip-bundle: true
    permissions:
      contents: read

  create-release:
    name: Create draft release
    needs: [validate-versions, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create or reuse the draft release for this tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.validate-versions.outputs.release_notes }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          count=$(printf '%s' "$existing" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::Found $count releases for $TAG; delete the extras before re-running"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::The release for $TAG is already published; refusing to upload over it"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Swiftie Quiz $TAG" -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build (macOS aarch64)
    needs: [validate-versions, create-release]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-apple-darwin
          cache: false
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.validate-versions.outputs.release_notes }}
          args: --target aarch64-apple-darwin
      - name: Upload macOS artifacts (for SLSA attestations)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bundles
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64)
    needs: [validate-versions, create-release]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-pc-windows-msvc
          cache: false
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.validate-versions.outputs.release_notes }}
          args: --target x86_64-pc-windows-msvc
      - name: Upload Windows artifacts (for SLSA attestations)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-bundles
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  verify-manifest:
    name: Verify updater manifest
    needs: [create-release, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Assert latest.json carries this version and every shipped platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json is missing from draft release $RELEASE_ID"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$asset_id" > latest.json
          jq . latest.json
          expected="${TAG#v}"
          actual=$(jq -r .version latest.json)
          if [ "$actual" != "$expected" ]; then
            echo "::error::latest.json version is $actual, expected $expected"
            exit 1
          fi
          missing=""
          for platform in darwin-aarch64 darwin-aarch64-app windows-x86_64 windows-x86_64-nsis; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null; then
              missing="$missing $platform"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json lacks a url or signature for:$missing"
            exit 1
          fi

  attest:
    name: SLSA build provenance attestations
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bundles
          path: artifacts/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-bundles
          path: artifacts/windows
      # actions/upload-artifact@v7 collapses paths to the least-common-ancestor
      # of all inputs, so multi-source uploads land in subdirectories under the
      # artifact root. Globs use ** to match recursively.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/macos/**/*.app.tar.gz
            artifacts/macos/**/*.dmg
            artifacts/windows/**/*-setup.exe
