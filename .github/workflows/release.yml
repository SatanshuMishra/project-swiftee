name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-versions:
    name: Validate version coherence + extract release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_notes: ${{ steps.check.outputs.notes }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - run: flutter pub get
      - name: Check the version, CHANGELOG and updater key, and extract the release notes
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(dart run tool/release/check_release.dart "$TAG")
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "version=${TAG#v}"
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  ci-passed:
    name: Tagged commit passed CI on main
    needs: validate-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - run: flutter pub get
      - name: Require the tagged commit to be on main with a successful CI OK
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: dart run tool/release/release_gate.dart ci-passed

  create-release:
    name: Create draft release
    needs: [validate-versions, ci-passed]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create or reuse the draft release for this tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.validate-versions.outputs.release_notes }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          count=$(printf '%s' "$existing" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::Found $count releases for $TAG; delete the extras before re-running"
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::The release for $TAG is already published; refusing to upload over it"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Project Swiftie $TAG" -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build (macOS aarch64)
    needs: [validate-versions, create-release]
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate-versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - name: Build the macOS app
        run: flutter build macos --release --dart-define=EDITION=open
      - name: Package the DMG and updater archive
        run: tool/release/package_macos.sh "$VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Sign the updater archive with the Tauri updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.1 signer sign "build/release/Project Swiftie.app.tar.gz"
      - name: Stage the files under the names GitHub gives release assets
        run: |
          set -euo pipefail
          mkdir -p build/upload
          for file in build/release/*; do
            name=$(basename "$file")
            cp "$file" "build/upload/${name// /.}"
          done
          ls -l build/upload
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" build/upload/* --clobber
      - name: Upload macOS artifacts (for the manifest and SLSA attestations)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bundles
          path: |
            build/upload/*.app.tar.gz
            build/upload/*.app.tar.gz.sig
            build/upload/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64, ${{ matrix.edition }})
    needs: [validate-versions, create-release]
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: ana
            product: Project Swiftie
          - edition: open
            product: Project Swiftie Open
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate-versions.outputs.version }}
      EDITION: ${{ matrix.edition }}
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - name: Build the Windows app
        run: flutter build windows --release --dart-define=EDITION="$EDITION"
      - name: Install NSIS when makensis is missing
        shell: pwsh
        run: |
          $installed = (Get-Command makensis -CommandType Application -ErrorAction SilentlyContinue) -or
            (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')) -or
            (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'))
          if (-not $installed) {
            choco install nsis -y
          }
      - name: Package the setup executable
        shell: pwsh
        run: ./tool/release/package_windows.ps1 -Version $env:VERSION -Edition $env:EDITION
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Sign the setup executable with the Tauri updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.1 signer sign "build/release/${PRODUCT}_${VERSION}_x64-setup.exe"
      - name: Stage the files under the names GitHub gives release assets
        run: |
          set -euo pipefail
          mkdir -p build/upload
          for file in build/release/*; do
            name=$(basename "$file")
            cp "$file" "build/upload/${name// /.}"
          done
          ls -l build/upload
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" build/upload/* --clobber
      - name: Upload Windows artifacts (for the manifest and SLSA attestations)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.edition }}-bundles
          path: |
            build/upload/*-setup.exe
            build/upload/*-setup.exe.sig
          if-no-files-found: error

  publish-manifest:
    name: Publish updater manifest
    needs: [validate-versions, create-release, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - run: flutter pub get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bundles
          path: artifacts/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-ana-bundles
          path: artifacts/windows-ana
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-open-bundles
          path: artifacts/windows-open
      - name: Write latest.json from the signatures
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
          NOTES: ${{ needs.validate-versions.outputs.release_notes }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          mac_sig="artifacts/macos/Project.Swiftie.app.tar.gz.sig"
          win_sig="artifacts/windows-ana/Project.Swiftie_${VERSION}_x64-setup.exe.sig"
          win_open_sig="artifacts/windows-open/Project.Swiftie.Open_${VERSION}_x64-setup.exe.sig"
          for sig in "$mac_sig" "$win_sig" "$win_open_sig"; do
            if [ ! -f "$sig" ] || [ ! -f "${sig%.sig}" ]; then
              echo "::error::$sig or the file it signs is missing from the build artifacts"
              exit 1
            fi
          done
          printf '%s\n' "$NOTES" > release-notes.md
          dart run tool/release/make_manifest.dart \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "$BASE_URL" \
            --mac-tar "${mac_sig%.sig}" \
            --mac-sig "$mac_sig" \
            --win-exe "${win_sig%.sig}" \
            --win-sig "$win_sig" \
            --win-open-exe "${win_open_sig%.sig}" \
            --win-open-sig "$win_open_sig" \
            --out latest.json
          jq . latest.json
      - name: Upload latest.json to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" latest.json --clobber
      - name: Assert latest.json carries this version and every shipped platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json is missing from draft release $RELEASE_ID"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$asset_id" > latest.json
          jq . latest.json
          expected="${TAG#v}"
          actual=$(jq -r .version latest.json)
          if [ "$actual" != "$expected" ]; then
            echo "::error::latest.json version is $actual, expected $expected"
            exit 1
          fi
          asset_names=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[].name')
          download_base="https://github.com/$GH_REPO/releases/download/$TAG"
          broken=""
          for platform in darwin-aarch64 darwin-aarch64-app windows-x86_64 windows-x86_64-nsis windows-x86_64-open; do
            url=$(jq -r --arg p "$platform" '.platforms[$p].url // ""' latest.json)
            signature=$(jq -r --arg p "$platform" '.platforms[$p].signature // ""' latest.json)
            encoded_name="${url##*/}"
            name=$(printf '%b' "${encoded_name//%/\\x}")
            if [ -z "$url" ] || [ -z "$signature" ]; then
              broken="$broken $platform(missing url or signature)"
            elif [ "${url%/*}" != "$download_base" ]; then
              broken="$broken $platform(url is not a download from this release)"
            elif ! grep -qxF -- "$name" <<< "$asset_names"; then
              broken="$broken $platform(url points at an asset not on this release)"
            fi
          done
          if [ -n "$broken" ]; then
            echo "::error::latest.json is not publishable:$broken"
            exit 1
          fi

  attest:
    name: SLSA build provenance attestations
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bundles
          path: artifacts/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-ana-bundles
          path: artifacts/windows-ana
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-open-bundles
          path: artifacts/windows-open
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/macos/**/*.app.tar.gz
            artifacts/macos/**/*.dmg
            artifacts/windows-ana/**/*-setup.exe
            artifacts/windows-open/**/*-setup.exe

  publish-release:
    name: Publish the release
    needs: [validate-versions, create-release, publish-manifest, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: false
      - run: flutter pub get
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: dart run tool/release/release_gate.dart publish
