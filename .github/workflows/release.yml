name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-versions:
    name: Validate version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert versions match across package.json, Cargo.toml, tauri.conf.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk -F'"' '/^version/{print $2; exit}' src-tauri/Cargo.toml)
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Versions: tag=$TAG package=$PKG cargo=$CARGO conf=$CONF"
          if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$CARGO" ] || [ "$CARGO" != "$CONF" ]; then
            echo "::error::Version drift detected — tag, package.json, Cargo.toml, and tauri.conf.json must all match"
            exit 1
          fi
      - name: Assert CHANGELOG entry exists for this tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing"
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for ## [$TAG]"
            exit 1
          fi
      - name: Refuse to release with the development minisign pubkey
        run: |
          set -euo pipefail
          # The development placeholder pubkey embedded by the Phase 3
          # implementer has key ID 2A43CC33F3FB57BB. The operator MUST
          # rotate to a production keypair (plan Task 10) before tagging.
          # The pubkey is base64-encoded inside tauri.conf.json, so we
          # decode it and grep the plaintext for the sentinel key ID.
          node -e "
            const conf = require('./src-tauri/tauri.conf.json');
            const pk = (conf.plugins && conf.plugins.updater && conf.plugins.updater.pubkey) || '';
            const decoded = Buffer.from(pk, 'base64').toString('utf8');
            if (decoded.includes('2A43CC33F3FB57BB')) {
              console.error('::error::Development minisign pubkey (key ID 2A43CC33F3FB57BB) is still embedded in tauri.conf.json. Rotate to a production keypair before releasing — see plan Task 10.');
              process.exit(1);
            }
          "

  build-macos:
    name: Build (macOS aarch64)
    needs: validate-versions
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Swiftie Quiz ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Manifest is published after the operator swap-test."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64)
    needs: validate-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Swiftie Quiz ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Manifest is published after the operator swap-test."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish-manifest:
    name: Compose latest.json + provenance attestations
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts/windows
      - name: Compose latest.json
        run: bash .github/scripts/compose-manifest.sh
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Upload manifest to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            artifacts/macos/*.app.tar.gz
            artifacts/macos/*.dmg
            artifacts/windows/*-setup.exe
