name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-macos:
    name: Build (macos-26)
    needs: [analyze]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the app entry point
        id: app
        shell: bash
        run: |
          if [ -f lib/main.dart ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lib/main.dart is not on this branch yet, so the macOS build is skipped"
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.app.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Build the macOS app
        if: steps.app.outputs.present == 'true'
        run: flutter build macos --release

      - name: Package the DMG and updater archive
        if: steps.app.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)
          tool/release/package_macos.sh "$version"

      - name: Upload build artifacts
        if: steps.app.outputs.present == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swiftie-quiz-aarch64-apple-darwin
          path: |
            build/release/*.dmg
            build/release/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build (windows-2025)
    needs: [analyze]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the app entry point
        id: app
        shell: bash
        run: |
          if [ -f lib/main.dart ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lib/main.dart is not on this branch yet, so the Windows build is skipped"
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.app.outputs.present == 'true'
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Build the Windows app
        if: steps.app.outputs.present == 'true'
        run: flutter build windows --release

      - name: Install NSIS when makensis is missing
        if: steps.app.outputs.present == 'true'
        shell: pwsh
        run: |
          $installed = (Get-Command makensis -CommandType Application -ErrorAction SilentlyContinue) -or
            (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')) -or
            (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'))
          if (-not $installed) {
            choco install nsis -y
          }

      - name: Package the setup executable
        if: steps.app.outputs.present == 'true'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          ./tool/release/package_windows.ps1 -Version $version

      - name: Upload build artifacts
        if: steps.app.outputs.present == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swiftie-quiz-x86_64-pc-windows-msvc
          path: build/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  ci-ok:
    name: CI OK
    if: always()
    needs: [analyze, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be intentionally skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Required CI jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
