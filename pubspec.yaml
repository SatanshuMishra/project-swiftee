name: swiftie_quiz
description: "A Taylor Swift trivia game"
publish_to: none
version: 0.5.1+5

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.1.6
  flutter_svg: ^2.3.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  http: ^1.6.0
  cryptography: ^2.9.0
  archive: ^4.3.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  collection: ^1.19.1
  blobatar: 0.1.0
  together_protocol:
    path: packages/together_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/catalog/
    - assets/certs/
    - assets/cat/
    - assets/sounds/
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
