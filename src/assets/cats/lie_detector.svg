<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="none"/>
  <!-- Cat ears -->
  <path d="M38,50 L50,20 L62,50" fill="#f97316" opacity="0.8"/>
  <path d="M66,50 L78,20 L90,50" fill="#f97316" opacity="0.8"/>
  <!-- Cat head -->
  <circle cx="64" cy="62" r="24" fill="#f97316"/>
  <!-- Eyes -->
  <circle cx="54" cy="58" r="3" fill="white"/>
  <circle cx="74" cy="58" r="3" fill="white"/>
  <circle cx="55" cy="58" r="1.5" fill="#1a1a1a"/>
  <circle cx="75" cy="58" r="1.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <path d="M62,66 L64,69 L66,66" fill="#ff9999" stroke="#ff9999" stroke-width="1"/>
  <!-- Mouth -->
  <path d="M60,71 Q64,75 68,71" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Body -->
  <path d="M40,90 Q64,70 88,90" fill="#f97316" opacity="0.6"/>
  <!-- Detective hat -->
  <ellipse cx="64" cy="42" rx="20" ry="6" fill="#8b4513" opacity="0.8"/>
  <path d="M48,42 Q64,20 80,42" fill="#8b4513" opacity="0.9"/>
  <!-- Magnifying glass -->
  <circle cx="86" cy="80" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="92" y1="86" x2="98" y2="94" stroke="#fbbf24" stroke-width="2"/>
</svg>