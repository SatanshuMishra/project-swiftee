[package]
name = "swiftie-quiz"
version = "0.2.3"
edition = "2024"
description = "A Taylor Swift trivia game"
license = "Apache-2.0"

[lib]
name = "swiftie_quiz_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-fs = "2.6"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "rustls-no-provider"], default-features = false }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
regex = "1"
futures = "0.3"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
